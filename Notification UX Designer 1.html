<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification UX Designer Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
            min-height: 100vh;
            gap: 40px;
            padding: 40px 20px;
        }

        .designer-panel {
            flex: 1;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-height: calc(100vh - 80px);
            overflow-y: auto;
        }

        .phone-preview {
            flex: 0 0 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #666;
            margin-bottom: 32px;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-row {
            display: flex;
            gap: 16px;
        }

        .form-row .form-group {
            flex: 1;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: #fff;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .icon-selector {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 12px;
            margin-top: 8px;
        }

        .icon-option {
            width: 48px;
            height: 48px;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #fff;
        }

        .icon-option:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .icon-option.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .color-picker-group {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .color-option {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .color-option:hover {
            transform: scale(1.1);
        }

        .color-option.selected {
            border-color: #333;
            transform: scale(1.1);
        }

        .phone-mockup {
            width: 320px;
            height: 640px;
            background: #1c1c1e;
            border-radius: 40px;
            padding: 20px 8px;
            position: relative;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            border-radius: 32px;
            position: relative;
            overflow: hidden;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            color: white;
            font-size: 14px;
            font-weight: 600;
        }

        .time {
            font-weight: 700;
        }

        .status-icons {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .notification-area {
            position: absolute;
            top: 60px;
            left: 16px;
            right: 16px;
        }

        .notification {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .notification-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .notification-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: white;
        }

        .notification-meta {
            flex: 1;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .app-name {
            font-weight: 600;
            font-size: 14px;
            color: #333;
        }

        .time-ago {
            font-size: 12px;
            color: #666;
        }

        .notification-title {
            font-weight: 600;
            font-size: 15px;
            color: #333;
            margin-bottom: 4px;
        }

        .notification-body {
            font-size: 14px;
            color: #666;
            line-height: 1.4;
        }

        .notification-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .action-button {
            flex: 1;
            padding: 8px 16px;
            border: 1px solid #e1e5e9;
            border-radius: 8px;
            background: #f8f9fa;
            color: #333;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .action-button:hover {
            background: #e9ecef;
        }

        .action-button.primary {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .style-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .style-tab {
            padding: 8px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 13px;
            font-weight: 500;
        }

        .style-tab.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .preview-controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .control-button {
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            background: #667eea;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .control-button:hover {
            background: #5a6fd8;
            transform: translateY(-2px);
        }

        .control-button.secondary {
            background: #6c757d;
        }

        .control-button.secondary:hover {
            background: #5a6268;
        }

        .advanced-options {
            border-top: 1px solid #e1e5e9;
            padding-top: 24px;
            margin-top: 24px;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 28px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 28px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #667eea;
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        .toggle-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .feature-badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-left: 8px;
        }

        @media (max-width: 1024px) {
            .container {
                flex-direction: column;
                gap: 20px;
            }
            
            .phone-preview {
                flex: none;
                align-self: center;
            }
        }

        .export-panel {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 16px;
            margin-top: 20px;
        }

        .export-code {
            background: #2d3748;
            color: #e2e8f0;
            padding: 12px;
            border-radius: 8px;
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 12px;
            overflow-x: auto;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="designer-panel">
            <h1>Notification UX Designer</h1>
            <p class="subtitle">Create stunning mobile notifications with precision and style</p>

            <div class="style-tabs">
                <div class="style-tab active" data-style="ios">iOS Style</div>
                <div class="style-tab" data-style="material">Material</div>
                <div class="style-tab" data-style="custom">Custom</div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>App Name</label>
                    <input type="text" id="appName" value="MyApp" placeholder="Enter app name">
                </div>
                <div class="form-group">
                    <label>Time Display</label>
                    <select id="timeDisplay">
                        <option value="now">now</option>
                        <option value="1m">1m ago</option>
                        <option value="5m">5m ago</option>
                        <option value="1h">1h ago</option>
                        <option value="custom">Custom</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>App Icon</label>
                <div class="icon-selector">
                    <div class="icon-option selected" data-icon="📱">📱</div>
                    <div class="icon-option" data-icon="📧">📧</div>
                    <div class="icon-option" data-icon="💬">💬</div>
                    <div class="icon-option" data-icon="📷">📷</div>
                    <div class="icon-option" data-icon="🎵">🎵</div>
                    <div class="icon-option" data-icon="🏃">🏃</div>
                    <div class="icon-option" data-icon="🍕">🍕</div>
                    <div class="icon-option" data-icon="🚗">🚗</div>
                    <div class="icon-option" data-icon="💰">💰</div>
                    <div class="icon-option" data-icon="🎮">🎮</div>
                    <div class="icon-option" data-icon="☁️">☁️</div>
                    <div class="icon-option" data-icon="⚡">⚡</div>
                </div>
            </div>

            <div class="form-group">
                <label>Icon Background Color</label>
                <div class="color-picker-group">
                    <div class="color-option selected" style="background: #667eea" data-color="#667eea"></div>
                    <div class="color-option" style="background: #f093fb" data-color="#f093fb"></div>
                    <div class="color-option" style="background: #4facfe" data-color="#4facfe"></div>
                    <div class="color-option" style="background: #43e97b" data-color="#43e97b"></div>
                    <div class="color-option" style="background: #fa709a" data-color="#fa709a"></div>
                    <div class="color-option" style="background: #ffecd2" data-color="#ffecd2"></div>
                    <div class="color-option" style="background: #ff9a9e" data-color="#ff9a9e"></div>
                    <div class="color-option" style="background: #a8edea" data-color="#a8edea"></div>
                </div>
            </div>

            <div class="form-group">
                <label>Notification Title</label>
                <input type="text" id="notificationTitle" value="New Message" placeholder="Enter notification title">
            </div>

            <div class="form-group">
                <label>Notification Body</label>
                <textarea id="notificationBody" placeholder="Enter your notification message...">You have a new message waiting for you. Tap to view details.</textarea>
            </div>

            <div class="advanced-options">
                <h3 style="margin-bottom: 16px; color: #333;">Advanced Features <span class="feature-badge">Pro</span></h3>
                
                <div class="toggle-group">
                    <label>Show Action Buttons</label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="showActions" checked>
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="form-row" id="actionButtonsRow">
                    <div class="form-group">
                        <label>Primary Action</label>
                        <input type="text" id="primaryAction" value="Reply" placeholder="Primary action">
                    </div>
                    <div class="form-group">
                        <label>Secondary Action</label>
                        <input type="text" id="secondaryAction" value="Dismiss" placeholder="Secondary action">
                    </div>
                </div>

                <div class="toggle-group">
                    <label>Critical Alert</label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="criticalAlert">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="toggle-group">
                    <label>Grouped Notification</label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="groupedNotification">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="form-group">
                    <label>Notification Priority</label>
                    <select id="priority">
                        <option value="normal">Normal</option>
                        <option value="high">High</option>
                        <option value="urgent">Urgent</option>
                    </select>
                </div>
            </div>

            <div class="preview-controls">
                <button class="control-button" onclick="previewNotification()">Preview Animation</button>
                <button class="control-button secondary" onclick="exportCode()">Export Code</button>
            </div>

            <div class="export-panel" id="exportPanel" style="display: none;">
                <h4>iOS Swift Code</h4>
                <div class="export-code" id="exportCode"></div>
            </div>
        </div>

        <div class="phone-preview">
            <div class="phone-mockup">
                <div class="phone-screen">
                    <div class="status-bar">
                        <span class="time">9:41</span>
                        <div class="status-icons">
                            <span>📶</span>
                            <span>📶</span>
                            <span>🔋</span>
                        </div>
                    </div>
                    <div class="notification-area" id="notificationArea">
                        <div class="notification" id="previewNotification">
                            <div class="notification-header">
                                <div class="notification-icon" id="previewIcon" style="background: #667eea;">📱</div>
                                <div class="notification-meta">
                                    <div class="app-name" id="previewAppName">MyApp</div>
                                    <div class="time-ago" id="previewTime">now</div>
                                </div>
                            </div>
                            <div class="notification-title" id="previewTitle">New Message</div>
                            <div class="notification-body" id="previewBody">You have a new message waiting for you. Tap to view details.</div>
                            <div class="notification-actions" id="previewActions">
                                <button class="action-button" id="previewSecondaryAction">Dismiss</button>
                                <button class="action-button primary" id="previewPrimaryAction">Reply</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentIcon = '📱';
        let currentColor = '#667eea';
        let notificationCount = 0;

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            updatePreview();
            bindEvents();
        });

        function bindEvents() {
            // Form inputs
            document.getElementById('appName').addEventListener('input', updatePreview);
            document.getElementById('notificationTitle').addEventListener('input', updatePreview);
            document.getElementById('notificationBody').addEventListener('input', updatePreview);
            document.getElementById('timeDisplay').addEventListener('change', updatePreview);
            document.getElementById('primaryAction').addEventListener('input', updatePreview);
            document.getElementById('secondaryAction').addEventListener('input', updatePreview);
            document.getElementById('showActions').addEventListener('change', updatePreview);
            document.getElementById('criticalAlert').addEventListener('change', updatePreview);
            document.getElementById('groupedNotification').addEventListener('change', updatePreview);
            document.getElementById('priority').addEventListener('change', updatePreview);

            // Icon selection
            document.querySelectorAll('.icon-option').forEach(option => {
                option.addEventListener('click', function() {
                    document.querySelectorAll('.icon-option').forEach(opt => opt.classList.remove('selected'));
                    this.classList.add('selected');
                    currentIcon = this.dataset.icon;
                    updatePreview();
                });
            });

            // Color selection
            document.querySelectorAll('.color-option').forEach(option => {
                option.addEventListener('click', function() {
                    document.querySelectorAll('.color-option').forEach(opt => opt.classList.remove('selected'));
                    this.classList.add('selected');
                    currentColor = this.dataset.color;
                    updatePreview();
                });
            });

            // Style tabs
            document.querySelectorAll('.style-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.style-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    updatePreview();
                });
            });
        }

        function updatePreview() {
            const appName = document.getElementById('appName').value || 'MyApp';
            const title = document.getElementById('notificationTitle').value || 'Notification';
            const body = document.getElementById('notificationBody').value || 'This is your notification message.';
            const timeDisplay = document.getElementById('timeDisplay').value;
            const showActions = document.getElementById('showActions').checked;
            const primaryAction = document.getElementById('primaryAction').value || 'Accept';
            const secondaryAction = document.getElementById('secondaryAction').value || 'Dismiss';
            const criticalAlert = document.getElementById('criticalAlert').checked;
            const grouped = document.getElementById('groupedNotification').checked;
            
            // Update preview elements
            document.getElementById('previewAppName').textContent = appName;
            document.getElementById('previewTitle').textContent = title;
            document.getElementById('previewBody').textContent = body;
            document.getElementById('previewIcon').textContent = currentIcon;
            document.getElementById('previewIcon').style.background = currentColor;
            document.getElementById('previewTime').textContent = timeDisplay === 'custom' ? 'now' : timeDisplay;
            document.getElementById('previewPrimaryAction').textContent = primaryAction;
            document.getElementById('previewSecondaryAction').textContent = secondaryAction;
            
            // Show/hide actions
            document.getElementById('previewActions').style.display = showActions ? 'flex' : 'none';
            document.getElementById('actionButtonsRow').style.display = showActions ? 'flex' : 'none';
            
            // Critical alert styling
            const notification = document.getElementById('previewNotification');
            if (criticalAlert) {
                notification.style.border = '2px solid #ff4757';
                notification.style.background = 'rgba(255, 71, 87, 0.1)';
            } else {
                notification.style.border = '1px solid rgba(255, 255, 255, 0.3)';
                notification.style.background = 'rgba(255, 255, 255, 0.95)';
            }
            
            // Grouped notification
            if (grouped) {
                createGroupedNotifications();
            } else {
                showSingleNotification();
            }
        }

        function createGroupedNotifications() {
            const area = document.getElementById('notificationArea');
            const appName = document.getElementById('appName').value || 'MyApp';
            
            area.innerHTML = `
                <div class="notification" style="margin-bottom: 2px;">
                    <div class="notification-header">
                        <div class="notification-icon" style="background: ${currentColor};">${currentIcon}</div>
                        <div class="notification-meta">
                            <div class="app-name">${appName} (3)</div>
                            <div class="time-ago">now</div>
                        </div>
                    </div>
                    <div class="notification-title">Multiple notifications</div>
                    <div class="notification-body">You have 3 new notifications from ${appName}</div>
                </div>
                <div class="notification" style="margin-left: 16px; margin-top: -8px; transform: scale(0.95); opacity: 0.8;"></div>
                <div class="notification" style="margin-left: 32px; margin-top: -8px; transform: scale(0.9); opacity: 0.6;"></div>
            `;
        }

        function showSingleNotification() {
            const area = document.getElementById('notificationArea');
            area.innerHTML = `
                <div class="notification" id="previewNotification">
                    <div class="notification-header">
                        <div class="notification-icon" id="previewIcon" style="background: ${currentColor};">${currentIcon}</div>
                        <div class="notification-meta">
                            <div class="app-name" id="previewAppName">${document.getElementById('appName').value || 'MyApp'}</div>
                            <div class="time-ago" id="previewTime">${document.getElementById('timeDisplay').value}</div>
                        </div>
                    </div>
                    <div class="notification-title" id="previewTitle">${document.getElementById('notificationTitle').value || 'Notification'}</div>
                    <div class="notification-body" id="previewBody">${document.getElementById('notificationBody').value || 'This is your notification message.'}</div>
                    <div class="notification-actions" id="previewActions" style="display: ${document.getElementById('showActions').checked ? 'flex' : 'none'};">
                        <button class="action-button" id="previewSecondaryAction">${document.getElementById('secondaryAction').value || 'Dismiss'}</button>
                        <button class="action-button primary" id="previewPrimaryAction">${document.getElementById('primaryAction').value || 'Accept'}</button>
                    </div>
                </div>
            `;
        }

        function previewNotification() {
            notificationCount++;
            const area = document.getElementById('notificationArea');
            const newNotification = document.createElement('div');
            newNotification.className = 'notification';
            newNotification.style.animationDelay = '0.1s';
            
            newNotification.innerHTML = `
                <div class="notification-header">
                    <div class="notification-icon" style="background: ${currentColor};">${currentIcon}</div>
                    <div class="notification-meta">
                        <div class="app-name">Live Preview #${notificationCount}</div>
                        <div class="time-ago">just now</div>
                    </div>
                </div>
                <div class="notification-title">Animation Test</div>
                <div class="notification-body">This demonstrates the notification animation behavior in real-time.</div>
            `;
            
            area.appendChild(newNotification);
            
            // Remove after 3 seconds
            setTimeout(() => {
                if (newNotification.parentNode) {
                    newNotification.style.animation = 'slideIn 0.3s ease-out reverse';
                    setTimeout(() => {
                        newNotification.remove();
                    }, 300);
                }
            }, 3000);
        }

        function exportCode() {
            const appName = document.getElementById('appName').value || 'MyApp';
            const title = document.getElementById('notificationTitle').value || 'Notification';
            const body = document.getElementById('notificationBody').value || 'This is your notification message.';
            const showActions = document.getElementById('showActions').checked;
            const criticalAlert = document.getElementById('criticalAlert').checked;
            
            const swiftCode = `
// iOS Notification Code
import UserNotifications

let content = UNMutableNotificationContent()
content.title = "${title}"
content.body = "${body}"
content.sound = ${criticalAlert ? 'UNNotificationSound.defaultCritical' : 'UNNotificationSound.default'}
${showActions ? `
// Add action buttons
let replyAction = UNNotificationAction(
    identifier: "REPLY_ACTION",
    title: "${document.getElementById('primaryAction').value || 'Reply'}",
    options: [.foreground]
)
let dismissAction = UNNotificationAction(
    identifier: "DISMISS_ACTION", 
    title: "${document.getElementById('secondaryAction').value || 'Dismiss'}",
    options: []
)
let category = UNNotificationCategory(
    identifier: "MESSAGE_CATEGORY",
    actions: [replyAction, dismissAction],
    intentIdentifiers: [],
    options: []
)
UNUserNotificationCenter.current().setNotificationCategories([category])
content.categoryIdentifier = "MESSAGE_CATEGORY"` : ''}

let request = UNNotificationRequest(
    identifier: UUID().uuidString,
    content: content,
